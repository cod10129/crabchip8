[package]
name = "crabchip8"
version = "0.4.2"
edition = "2024"
rust-version = "1.87"

[lints]
rust.missing_docs = "warn"
clippy.pedantic = { level = "warn", priority = -1 }
clippy.must_use_candidate = "allow"
clippy.return_self_not_must_use = "allow"
clippy.missing_errors_doc = "allow"
clippy.map_unwrap_or = "allow"

[dependencies]
fastrand = "2.5.0"

[workspace]
members = ["gic8"]
